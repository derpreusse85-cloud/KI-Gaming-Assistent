# Helldivers-2-Spielprofil, Aktionsliste nach dem in Gaming_assistent.md festgelegten Schema
# (Abschnitt "Aktionslisten-Format"): schlagwort -> Grundlage fuer die wortgebundene
# Tag-Beschreibung im Prompt und fuer die automatische Whisper-initial_prompt-Liste;
# beispiel -> Few-Shot-Beispiel im Prompt; taste -> Tastenkombination, nie im Prompt gezeigt.
#
# "schlagwort" steht hier durchgaengig als Liste in eckigen Klammern, auch wenn nur ein Wort
# drin ist (z.B. ["MG-43"]) - so bleibt die Schreibweise einheitlich, egal ob ein Tag ein
# oder mehrere gleichwertige Woerter hat (z.B. ["EAT", "Panzerabwehrkanone"]). Eigene weitere
# Woerter lassen sich einfach mit Komma innerhalb der eckigen Klammern ergaenzen, z.B.
# ["EAT", "Panzerabwehrkanone", "mein eigenes Wort"].
#
# WICHTIG: "taste" wurde von Claude aus acht Nutzer-Screenshots abgetippt (Stratagem Code PC-
# Spalte, dort als WASD notiert) und bereits gegen die Screenshots geprueft. Der Nutzer hat die
# Tastenbelegung im Spiel auf die Pfeiltasten umgestellt, deshalb sind hier ab 09.09.2026
# "up"/"down"/"left"/"right" statt "W"/"A"/"S"/"D" eingetragen (Zuordnung: W->up, A->left,
# S->down, D->right). "schlagwort" ist der bereits mit dem Nutzer abgestimmte Stand (inkl.
# Korrekturen: SEAF_Artillerie -> "Artillerie", EMS -> EMP).
#
# Konfliktcluster (mehrere Tags mit gemeinsamem Wortstamm, siehe Gespraechsverlauf):
#   A Gatling: Orbital_Gatling / Gatlinggeschuetz
#   B Rauchbeschuss: Adler_Rauchbeschuss / Orbital_Rauchbeschuss
#   C/H Kanone-Familie: Automatische_Kanone (Waffen) / Kanonengeschuetz (Robotik) / MG_Stellung (Bruecke) vs Schweres_MG (Waffen)
#   D Schildgenerator: Schildgenerator_Relais / Schildgenerator_Rucksack
#   E Guard Dog: Guard_Dog_Rover / Guard_Dog / Guard_Dog_Hunde_Atem
#   F Panzerabwehr: EAT / Panzerabwehrminen / Panzerabwehrstellung
#   G Moersergeschuetz: Moersergeschuetz / EMP_Moersergeschuetz
#   I Flammen-Familie: Flammenwerfer (Waffen) / Flammengeschuetz (Kriegsanleihen)
#   J Artillerie: SEAF_Artillerie ist jetzt der einzige Artillerie-Tag im Profil

# Kontextlaenge fuer "lms load": gemessen anhand des generierten System-Prompts (3.541 Prompt-
# Tokens bei 77 Tags, 08.09.2026) plus Marge fuer max_tokens und kuenftig ergaenzte Stratageme.
kontextlaenge: 8192

# Taste, die waehrend der gesamten "taste"-Sequenz jedes Tags gehalten wird (Helldivers-2-
# Standardeinstellung: Strg). Die "taste"-Listen selbst sind IMMER eine Tipp-Sequenz
# (nacheinander druecken/loslassen), niemals eine gleichzeitig gehaltene Kombination -- siehe
# Implementierungsplan. Wert ist noch nicht endgueltig, kann sich noch aendern (Nutzerhinweis
# 09.09.2026).
halte_taste: "ctrl"

# Kuratierte Kurzliste fuer den Whisper-initial_prompt (siehe prompt.py). Gemessen am
# 10.09.2026: ein initial_prompt aus ALLEN Schlagwoertern (700 Zeichen) kostet grob eine
# Sekunde zusaetzliche Latenz pro Sprachbefehl. Deshalb hier nur echte Fremdwoerter/Akronyme/
# Eigennamen, bei denen das deutsch trainierte Whisper-Modell eher stolpern koennte -- normale
# deutsche Komposita (z.B. "Flammenwerfer", "Granatwerfer") brauchen keine Vokabular-Stuetze.
# Erster Entwurf, noch nicht an echten Fehlerkennungen kalibriert -- falls im laufenden Betrieb
# (siehe training_log.py) auffaellt, dass Whisper ein bestimmtes Wort zuverlaessig falsch
# versteht, hier ergaenzen; falls sich diese Liste als unnoetig herausstellt, auch wieder kuerzen.
initial_prompt_schlagwoerter:
  - "EAT"
  - "Autocannon"
  - "Airburst"
  - "WASP"
  - "Railgun"
  - "Gatling"
  - "Napalm"
  - "Guard Dog"
  - "Patriot"
  - "Emancipator"
  - "Tesla"
  - "SOS"
  - "Resupply"
  - "SSSD"
  - "Prospecting Drill"
  - "Illumination Flare"
  - "Quasar"

