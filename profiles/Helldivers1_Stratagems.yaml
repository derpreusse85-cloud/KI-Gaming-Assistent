# Helldivers-1-Spielprofil, Aktionsliste nach dem in Gaming_assistent.md festgelegten Schema
# (Abschnitt "Aktionslisten-Format"): schlagwort -> Grundlage fuer die wortgebundene
# Tag-Beschreibung im Prompt und fuer die automatische Whisper-initial_prompt-Liste;
# beispiel -> Few-Shot-Beispiel im Prompt; taste -> Tastenkombination, nie im Prompt gezeigt.
#
# Codes/Namen per Claude aus der Wiki-Seite helldivers.wiki.gg/wiki/Helldivers_1:Stratagem_Codes
# abgetippt (12.09.2026) - die urspruenglich vom Nutzer verlinkte Fandom-Seite war per
# Cloudflare-Bot-Schutz nicht abrufbar. NICHT gegen Screenshots/das echte Spiel geprueft (anders
# als beim Helldivers-2-Profil) - vor dem produktiven Einsatz gegenpruefen.
#
# "schlagwort" traegt hier durchgaengig zwei Woerter: [0] der englische Original-Codename/-Name
# aus dem Spiel (z.B. "EAT-17", "Obliterator"), [1] eine deutsche Uebersetzung/Umschreibung
# (Nutzerwunsch, analog zum bereits im Helldivers-2-Profil bewaehrten Muster "EAT" +
# "Panzerabwehrkanone"). Die deutschen Woerter sind Claudes Uebersetzungsvorschlaege, nicht
# gegen echte Spielausgaben geprueft - koennen/sollten bei Bedarf noch angepasst werden.
#
# "halte_taste: ctrl" gilt laut Nutzerangabe (12.09.2026) genau wie bei Helldivers 2 - die
# Strg-Taste wird waehrend der ganzen Richtungssequenz gehalten.
#
# Konfliktkandidaten (12.09.2026 mit kleinem Testskript gegen das echte llama-server-Setup
# verifiziert, analog zum Vorgehen beim Helldivers-2-Profil):
#   A Maschinengewehr-Familie: MG-94 und MGX-42 teilten sich urspruenglich das blosse
#     Schlagwort "Maschinengewehr" - behoben (Nutzer-Anpassung) durch Ergaenzung der Modell-
#     nummer ("Maschinengewehr 94"/"Maschinengewehr 42"), im Test sauber unterschieden. Die
#     nummernlose Formulierung "Ruf das Maschinengewehr" bleibt bewusst mehrdeutig (waehlt im
#     Test deterministisch MG_94) - echte Mehrdeutigkeit der Eingabe, kein Fehler.
#   B Tiefflieger-Angriff-Familie: Strafing Run ("Tiefflieger-Angriff") und Heavy Strafing Run
#     ("Schwerer Tiefflieger-Angriff") teilen sich einen Wortstamm, wurden im Test aber
#     trotzdem sauber unterschieden ("Ruf den Tiefflieger-Angriff" vs. "Ruf den schweren
#     Tiefflieger-Angriff").
#
# Kontextlaenge: gemessen am tatsaechlich generierten System-Prompt (12.09.2026, per
# llama-server /tokenize-Endpunkt, siehe CLAUDE.md/Gaming_assistent.md Abschnitt
# "Sampling-Parameter" zur Messmethode): 3.128 Prompt-Tokens bei 55 Tags. 4096 laesst
# ausreichend Marge fuer max_tokens und kuenftig ergaenzte Stratageme.
kontextlaenge: 4096

halte_taste: "ctrl"

# Kuratierte Kurzliste fuer den Whisper-initial_prompt (siehe prompt.py) - hier besonders
# wichtig, weil anders als beim Helldivers-2-Profil fast durchgaengig englische Codenamen als
# erstes Schlagwort verwendet werden (siehe Kopfkommentar). Ohne diese Liste wuerde prompt.py
# automatisch ALLE Schlagwoerter (Englisch + Deutsch, 1.694 Zeichen) nehmen und stumpf auf 700
# Zeichen abschneiden - trifft dabei zufaellig, welche Woerter noch reinpassen. Deshalb hier
# bewusst nur die kurzen alphanumerischen Codes (z.B. "MG-94") und ungewoehnlichen/fremd
# klingenden Einzelwoerter (z.B. "Humblebee", "Thunderer") ausgewaehlt - die meisten Mehrwort-
# Phrasen mit gaengigen englischen Woertern (z.B. "Guard Dog", "Jump Pack") duerften einem
# deutschen Whisper-Modell keine Probleme machen, aehnlich wie bei den ausgelassenen normalen
# deutschen Komposita im Helldivers-2-Profil. Wie dort: noch nicht an echten Fehlerkennungen
# kalibriert, bei Bedarf ergaenzen/kuerzen.
initial_prompt_schlagwoerter:
  - "MG-94"
  - "MGX-42"
  - "LAS-98"
  - "AC-22"
  - "FLAM-40"
  - "TOX-13"
  - "RL-112"
  - "EAT-17"
  - "REP-80"
  - "APC"
  - "HAV"
  - "Obliterator"
  - "Rumbler"
  - "Commando"
  - "Bastion"
  - "Humblebee"
  - "Demolisher"
  - "Exosuit"
  - "Thunderer"
  - "Tesla"
  - "Angel"
  - "Distractor"
  - "Emplacement"
  - "Railcannon"
  - "Shredder"
  - "Incendiary"
  - "Kinetic"
  - "Conductors"
  - "Reinforce"
  - "Hellbomb"

